# micromamba env create -f environment.yml && micromamba run -n autopath pip install -e .
name: autopath
channels:
  - conda-forge
  - mdtools
dependencies:
  - python >=3.10,<3.13
  - numpy >=1.26,<2
  - scipy >=1.11
  - pandas >=2.0
  - matplotlib-base >=3.8
  - seaborn >=0.13
  - scikit-learn >=1.4
  - statsmodels >=0.14
  - tqdm
  - requests
  # simulation
  - openmm >=8.2,<9
  - mdtools::cvpack >=0.12,<0.13
  - openmmtools >=0.23
  - openmmforcefields >=0.14
  - openff-toolkit >=0.16
  - openff-units
  - ambertools
  - pdbfixer >=1.9
  - parmed >=4.2
  # trajectories and analysis
  - mdanalysis >=2.7
  - mdtraj >=1.10,<1.11.1  # 1.11.1 metadata requires numpy 2
  - rdkit >=2024.03
  - prolif >=2.0
  - pymol-open-source >=3.0
  - griddataformats
  - deeptime >=0.4.4
  - dtaidistance >=2.3
  - kmedoids >=0.5
  - leidenalg >=0.10
  - python-igraph >=0.11
  # tests
  - pytest
  - mdanalysistests
  - pip
