name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Install autopath
        run: pip install --no-deps --no-build-isolation -e .

      # these packages declare numpy<2 in their metadata but import and run under numpy 2
      - name: Check dependencies
        run: |
          out=$(pip check || true)
          bad=$(printf '%s\n' "$out" | grep -vE '^(pymol|edgembar|proprep|fetkutils|ndfes) [^ ]+ has requirement numpy' | grep -v '^No broken requirements found' | grep . || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
          echo "$out"

      # slow tests need large inputs or long runs; run them locally with -m slow
      - name: Run tests
        run: pytest tests -q --durations=15
